<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòng quay Pepsi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#003a8c;--ink:#ffffff;--muted:#cfe0ff;--card:#0a2f6e;--line:#2a5bb5;--accent:#e32934;--accent-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#00306f;--card:#082a62}}
:root[data-theme="dark"]{--bg:#00306f;--card:#082a62}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.brand h1{margin:0}
.stripe{height:6px;border-radius:3px;background:linear-gradient(90deg,#e32934 0 33%,#fff 33% 66%,#0057b8 66%);margin:0 0 18px;max-width:220px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 12% 18%,rgba(255,255,255,.12) 0 6px,transparent 7px),radial-gradient(circle at 88% 30%,rgba(255,255,255,.10) 0 10px,transparent 11px),radial-gradient(circle at 80% 82%,rgba(255,255,255,.12) 0 5px,transparent 6px),radial-gradient(circle at 20% 75%,rgba(255,255,255,.09) 0 12px,transparent 13px),radial-gradient(circle at 50% -10%,#1a6bd6 0,transparent 55%),var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:980px;margin:0 auto;padding:28px 18px 40px;display:grid;gap:28px;grid-template-columns:minmax(0,1fr);align-items:start}
@media(min-width:860px){main{grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr);padding-top:48px}}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.stage{position:relative;width:min(100%,480px);margin:0 auto}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;filter:drop-shadow(0 10px 22px rgba(29,27,58,.28))}
.pointer{position:absolute;left:50%;top:-6px;width:34px;height:44px;transform:translateX(-50%);z-index:2}
.go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:var(--accent);color:var(--accent-ink);font:800 clamp(13px,3.4vw,19px)/1 inherit;font-family:inherit;cursor:pointer;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.go:hover:not(:disabled){filter:brightness(1.06)}
.go:disabled{cursor:progress;opacity:.85}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
aside{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
aside h2{font-size:16px;margin:0 0 10px}
#result{min-height:64px;font-size:20px;font-weight:800;line-height:1.3;margin:0 0 16px;padding:14px;border-radius:12px;background:var(--bg);border:1px dashed var(--line)}
#result.win{border-style:solid;border-color:var(--accent)}
ol{margin:0;padding-left:22px;color:var(--muted);font-size:15px;max-height:260px;overflow:auto}
ol li{padding:3px 0}
.reset{margin-top:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section>
    <div class="brand"><svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="#fff"/><path d="M4 28A24 24 0 0 1 52 28C44 32 36 31 28 28C20 25 12 24 4 28Z" fill="#e32934"/><path d="M4 33C12 29 20 30 28 33C36 36 44 37 52 33A24.5 24.5 0 0 1 4 33Z" fill="#0057b8"/></svg><h1>Vòng quay Pepsi</h1></div>
    <div class="stripe"></div>
    <p class="sub">Bấm QUAY để thử vận may của bạn.</p>
    <div class="stage">
      <svg class="pointer" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 44 2 10a16 16 0 1 1 30 0z" fill="#e32934" stroke="#fff" stroke-width="3"/><circle cx="17" cy="14" r="5" fill="#fff"/></svg>
      <canvas id="wheel" role="img" aria-label="Vòng quay gồm 8 phần quà"></canvas>
      <button class="go" id="spin" type="button">QUAY</button>
    </div>
  </section>
  <aside>
    <h2>Kết quả</h2>
    <p id="result" aria-live="polite">Chưa quay lần nào.</p>
    <h2>Lịch sử quay</h2>
    <ol id="history"></ol>
    <button class="reset" id="clear" type="button">Xóa lịch sử</button>
  </aside>
</main>
<script>
(function(){
  var prizes=["Chúc bạn may mắn lần sau","Bình giữ nhiệt","Túi tote","Gối kê cổ","Áo có chữ ký Influencer","Vé Fanzone","Sạc dự phòng","Máy ảnh Canon R50"];
  var colors=["#9fb4d6","#e32934","#0057b8","#ffffff","#e32934","#0057b8","#ffffff","#e32934"];
  var textOn=["#0a2f6e","#fff","#fff","#0a2f6e","#fff","#fff","#0a2f6e","#fff"];
  var n=prizes.length,a=Math.PI*2/n,rot=0,busy=false;
  var cv=document.getElementById("wheel"),ctx=cv.getContext("2d");
  var btn=document.getElementById("spin"),res=document.getElementById("result"),hist=document.getElementById("history");
  var size=480;

  function lines(t){
    if(t.length<=14)return[t];
    var m=t.length/2,best=-1,i;
    for(i=0;i<t.length;i++){if(t[i]===" "&&(best<0||Math.abs(i-m)<Math.abs(best-m)))best=i}
    return best<0?[t]:[t.slice(0,best),t.slice(best+1)];
  }
  function draw(){
    var dpr=window.devicePixelRatio||1,w=cv.clientWidth||480;
    size=w;cv.width=w*dpr;cv.height=w*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var c=w/2,R=c-8,i;
    ctx.clearRect(0,0,w,w);
    ctx.save();ctx.translate(c,c);
    for(i=0;i<n;i++){
      var s=rot+i*a;
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,s,s+a);ctx.closePath();
      ctx.fillStyle=colors[i];ctx.fill();
      ctx.lineWidth=3;ctx.strokeStyle="#002868";ctx.stroke();
    }
    for(i=0;i<n;i++){
      ctx.save();ctx.rotate(rot+(i+.5)*a);
      ctx.textAlign="right";ctx.textBaseline="middle";ctx.fillStyle=textOn[i];
      var ls=lines(prizes[i]),fs=Math.max(11,w*.037),maxW=R*.58;
      ctx.font="700 "+fs+"px 'Be Vietnam Pro',system-ui,sans-serif";
      var widest=Math.max.apply(null,ls.map(function(l){return ctx.measureText(l).width}));
      if(widest>maxW){fs=fs*maxW/widest;ctx.font="700 "+fs+"px 'Be Vietnam Pro',system-ui,sans-serif"}
      ls.forEach(function(l,k){ctx.fillText(l,R-16,(k-(ls.length-1)/2)*fs*1.15)});
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.lineWidth=6;ctx.strokeStyle="#fff";ctx.stroke();
    ctx.restore();
  }
  function rnd(){
    if(window.crypto&&crypto.getRandomValues){var u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]/4294967296}
    return Math.random();
  }
  function spin(){
    if(busy)return;busy=true;btn.disabled=true;res.className="";res.textContent="Đang quay...";
    var win=Math.floor(rnd()*n);
    var jitter=(rnd()-.5)*a*.7;
    var base=Math.PI*1.5-(win+.5)*a+jitter;
    var TAU=Math.PI*2,start=rot;
    var end=start-(start%TAU)+TAU*(6+Math.floor(rnd()*3))+base;
    if(end<start+TAU*5)end+=TAU;
    var dur=5200,t0=performance.now();
    function step(t){
      var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
      rot=start+(end-start)*e;draw();
      if(p<1){requestAnimationFrame(step)}else{done(win)}
    }
    requestAnimationFrame(step);
  }
  function done(i){
    busy=false;btn.disabled=false;rot=rot%(Math.PI*2);draw();
    var lose=i===0;
    res.className="win";
    res.textContent=lose?"Chúc bạn may mắn lần sau!":"Chúc mừng! Bạn trúng: "+prizes[i];
    var li=document.createElement("li");li.textContent=prizes[i];hist.insertBefore(li,hist.firstChild);
  }
  btn.addEventListener("click",spin);
  document.getElementById("clear").addEventListener("click",function(){hist.innerHTML="";res.className="";res.textContent="Chưa quay lần nào."});
  window.addEventListener("resize",draw);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(draw)}
  draw();
})();
</script>
</body>
</html>
